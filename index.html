<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Red Eye | Interactive Ophthalmology</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="red-eye.js?v=4" defer></script>
  <script src="vault.js?v=4" defer></script>
  <script src="openrouter.js?v=4" defer></script>
  <script src="assessor.js?v=4" defer></script>
  <script src="case.js?v=4" defer></script>
</head>
<body>
  <div id="case-app" class="locked" inert>
    <header class="site-header">
      <div class="shell header-row">
        <div>
          <strong class="brand">Interactive Ophthalmology</strong>
          <h1>The Red Eye</h1>
        </div>
        <button id="theme" type="button" aria-label="Dark mode" title="Dark mode">☾</button>
      </div>
    </header>
    <main class="shell">
      <nav id="stages" aria-label="Case progress"></nav>
      <div class="layout">
        <section id="scene" class="card" aria-labelledby="scene-title"></section>
        <aside id="notes" class="card" aria-labelledby="notes-title"></aside>
      </div>
    </main>
    <footer class="site-footer">Developed by Karanvir Gill, Arvin Zaker</footer>
  </div>
  <dialog id="unlock-dialog" class="unlock-dialog" aria-labelledby="unlock-title">
    <form id="unlock-form">
      <h2 id="unlock-title">Unlock the case</h2>
      <label for="chat-passphrase">Passphrase</label>
      <input id="chat-passphrase" type="password" required autofocus autocomplete="off">
      <button id="unlock-button" class="primary" type="submit">Unlock</button>
      <p id="unlock-status" class="chat-status" role="status"></p>
      <p class="muted">Typed questions are sent to OpenRouter. Keep them about Sarah’s case.</p>
    </form>
  </dialog>
  <noscript>Enable JavaScript to start the case.</noscript>
</body>
</html>
